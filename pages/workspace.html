<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olejové farby</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Olejové farby</h1>

    <figure class="hotspot-image">
      <img src="../img/farby.jpg" alt="6 tub olejovych farieb" width="1200" height="800">

      <div class="hotspot" style="--x: 14%; --y: 30%">
        <button class="hotspot__dot" type="button" aria-label="Bilela farba"></button>
        <div class="hotspot__panel">
          <h2>Biela</h2>
          <p>Laik by povedal že existuje len jeden druh bielej, no opak je však pravdou.</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 57%; --y: 30%">
        <button class="hotspot__dot" type="button" aria-label="orandžová farba"></button>
        <div class="hotspot__panel">
          <h2>oranžová</h2>
          <p>Táto zdanlivo oranžova farba sa ulemcami casto nazýva inými menami, napríklad okrová, alebo scarlet.</p>
        </div>
      </div>

      <div class="hotspot" style="--x: 96%; --y: 80%">
        <button class="hotspot__dot" type="button" aria-label="Riedidlo"></button>
        <div class="hotspot__panel">
          <h2>Riedidlo</h2>
          <p>Na prácu s olejovými farbami je potrebné mať správne riedidlo, aby sme mohli dostat tu správnu konzistenciu.</p>
        </div>
      </div>
    </figure>

    <p>Text pod obrázkom, aby bolo vidieť, čo sa deje s obsahom pod ním.</p>
  </main>
</body>
</html>
